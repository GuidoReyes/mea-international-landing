<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MEA · Security Operations · Sign in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0f17; color: #dbe4f3;
      font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    }
    .box { width: min(92vw, 380px); padding: 32px 28px; border: 1px solid #1c2537; border-radius: 10px; background: #0f1523; }
    h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .04em; }
    .sub { margin: 0 0 24px; font-size: 12px; color: #7d8aa3; }
    label { display: block; margin-bottom: 6px; font-size: 11px; color: #7d8aa3; text-transform: uppercase; letter-spacing: .08em; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #1c2537; border-radius: 6px; background: #0b0f17; color: inherit; font: inherit; }
    input:focus { outline: 2px solid #f0a500; outline-offset: 1px; }
    button { width: 100%; margin-top: 14px; padding: 11px 12px; border: 0; border-radius: 6px; background: #f0a500; color: #1a1300; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .error { min-height: 18px; margin: 12px 0 0; font-size: 12px; color: #ff3355; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Security Operations</h1>
    <p class="sub">MEA International · Internal tool</p>
    <form id="loginForm" autocomplete="off">
      <label for="keyInput">Access key</label>
      <input type="password" id="keyInput" name="key" autocomplete="off" required autofocus />
      <button type="submit" id="submitBtn">Authenticate →</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/security/login.js"></script>
</body>
</html>
